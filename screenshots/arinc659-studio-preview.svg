<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0a0e17"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="920" height="45" rx="6" fill="#111827" stroke="#2e3b52"/>
  <text x="35" y="48" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">ARINC659Forge Pro &mdash; SafeBus Backplane Data Bus Studio</text>
  <rect x="750" y="30" width="170" height="25" rx="12" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
  <text x="765" y="47" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80">100% COMPLIANT</text>

  <!-- Top Oscillogram -->
  <rect x="20" y="80" width="920" height="150" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="35" y="105" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">SAFEBUS 100 µs MAJOR CYCLE TDMA OSCILLOGRAM (DUAL 30 Mbps BUS A &amp; BUS B)</text>

  <rect x="35" y="115" width="890" height="75" rx="4" fill="#030712" stroke="#1e293b"/>
  <!-- Bus A Track -->
  <text x="45" y="138" font-family="monospace" font-size="10" fill="#38bdf8">BUS A</text>
  <line x1="90" y1="135" x2="910" y2="135" stroke="#1e293b" stroke-width="1"/>
  <rect x="100" y="123" width="30" height="18" fill="#a855f7"/>
  <rect x="140" y="123" width="90" height="18" fill="#0284c7" stroke="#38bdf8"/>
  <rect x="245" y="123" width="120" height="18" fill="#0284c7" stroke="#38bdf8"/>
  <rect x="380" y="123" width="90" height="18" fill="#0284c7" stroke="#38bdf8"/>
  <rect x="510" y="123" width="120" height="18" fill="#0284c7" stroke="#38bdf8"/>
  <rect x="645" y="123" width="140" height="18" fill="#0284c7" stroke="#38bdf8"/>
  <rect x="800" y="123" width="70" height="18" fill="#0284c7" stroke="#38bdf8"/>

  <!-- Bus B Track -->
  <text x="45" y="172" font-family="monospace" font-size="10" fill="#34d399">BUS B</text>
  <line x1="90" y1="170" x2="910" y2="170" stroke="#1e293b" stroke-width="1"/>
  <rect x="100" y="157" width="30" height="18" fill="#a855f7"/>
  <rect x="140" y="157" width="90" height="18" fill="#059669" stroke="#34d399"/>
  <rect x="245" y="157" width="120" height="18" fill="#059669" stroke="#34d399"/>
  <rect x="380" y="157" width="90" height="18" fill="#059669" stroke="#34d399"/>
  <rect x="510" y="157" width="120" height="18" fill="#059669" stroke="#34d399"/>
  <rect x="645" y="157" width="140" height="18" fill="#059669" stroke="#34d399"/>
  <rect x="800" y="157" width="70" height="18" fill="#059669" stroke="#34d399"/>

  <text x="100" y="202" font-family="monospace" font-size="9" fill="#64748b">0µs</text>
  <text x="250" y="202" font-family="monospace" font-size="9" fill="#64748b">20µs</text>
  <text x="450" y="202" font-family="monospace" font-size="9" fill="#64748b">50µs</text>
  <text x="650" y="202" font-family="monospace" font-size="9" fill="#64748b">75µs</text>
  <text x="880" y="202" font-family="monospace" font-size="9" fill="#64748b">100µs</text>

  <!-- Left Controls -->
  <rect x="20" y="245" width="360" height="275" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="35" y="270" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">FAULT INJECTION &amp; INTERLOCKS (FCR)</text>

  <rect x="35" y="285" width="160" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="307" font-family="monospace" font-size="10" fill="#cbd5e1">CUT BUS A</text>
  <rect x="205" y="285" width="160" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="235" y="307" font-family="monospace" font-size="10" fill="#cbd5e1">CUT BUS B</text>

  <rect x="35" y="330" width="160" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="352" font-family="monospace" font-size="10" fill="#cbd5e1">INJECT BABBLER</text>
  <rect x="205" y="330" width="160" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="215" y="352" font-family="monospace" font-size="10" fill="#cbd5e1">INJECT SKEW (&gt;40ns)</text>

  <rect x="35" y="380" width="330" height="60" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="45" y="400" font-family="monospace" font-size="9" fill="#4ade80">&bull; BIU-1 (Command) : SYNCHRONIZED</text>
  <text x="45" y="415" font-family="monospace" font-size="9" fill="#4ade80">&bull; BIU-2 (Monitor) : MATCHED (12.5 ns skew &lt;= 40 ns)</text>
  <text x="45" y="430" font-family="monospace" font-size="9" fill="#4ade80">&bull; Driver Gate     : ENABLED (Dual-Line Transmit)</text>

  <rect x="35" y="450" width="330" height="55" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="45" y="470" font-family="monospace" font-size="9" fill="#4ade80">&bull; Hardware Babbler Watch-dog: ARMED (Normal)</text>
  <text x="45" y="488" font-family="monospace" font-size="9" fill="#4ade80">&bull; Overrun Duration: 0 ns (&lt;= 200 ns threshold)</text>

  <!-- Right Dashboards -->
  <rect x="400" y="245" width="540" height="275" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="415" y="270" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">SAFEBUS BACKPLANE METRICS &amp; TDMA SCHEDULE</text>
  
  <rect x="415" y="285" width="115" height="45" rx="4" fill="#070d18"/>
  <text x="435" y="308" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">60.0 Mbps</text>
  <text x="430" y="322" font-family="monospace" font-size="8" fill="#64748b">ACTIVE BANDWIDTH</text>

  <rect x="545" y="285" width="115" height="45" rx="4" fill="#070d18"/>
  <text x="565" y="308" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399">12.5 ns</text>
  <text x="555" y="322" font-family="monospace" font-size="8" fill="#64748b">BIU CLOCK SKEW</text>

  <rect x="675" y="285" width="115" height="45" rx="4" fill="#070d18"/>
  <text x="705" y="308" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">38.4%</text>
  <text x="690" y="322" font-family="monospace" font-size="8" fill="#64748b">BUS UTILIZATION</text>

  <rect x="805" y="285" width="120" height="45" rx="4" fill="#070d18"/>
  <text x="830" y="308" font-family="monospace" font-size="14" font-weight="bold" fill="#4ade80">0.00%</text>
  <text x="815" y="322" font-family="monospace" font-size="8" fill="#64748b">COLLISION PROB</text>

  <rect x="415" y="340" width="510" height="110" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="425" y="360" font-family="monospace" font-size="9" fill="#cbd5e1">S1: FMC_NAV_PARTITION   [12.0 µs] Src: FMC_L   FCS: 0x4D2A [DUAL-BUS A+B]</text>
  <text x="425" y="378" font-family="monospace" font-size="9" fill="#cbd5e1">S2: ADIRS_ATTITUDE_DATA [16.0 µs] Src: ADIRS_1 FCS: 0x88BC [DUAL-BUS A+B]</text>
  <text x="425" y="396" font-family="monospace" font-size="9" fill="#cbd5e1">S3: DFGS_AUTOPILOT_CMD  [12.0 µs] Src: FCC_A   FCS: 0x1A4F [DUAL-BUS A+B]</text>
  <text x="425" y="414" font-family="monospace" font-size="9" fill="#cbd5e1">S5: FADEC_ENGINE_TELEM  [16.0 µs] Src: EEC_1   FCS: 0x9021 [DUAL-BUS A+B]</text>
  <text x="425" y="432" font-family="monospace" font-size="9" fill="#cbd5e1">S6: DPM_DISPLAY_PRIMS   [18.0 µs] Src: DPM_1   FCS: 0xE4B0 [DUAL-BUS A+B]</text>

  <rect x="415" y="460" width="510" height="48" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="430" y="482" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">NORMATIVE AIRWORTHINESS AUDIT: 10/10 CRITERIA VERIFIED (100.0%)</text>
  <text x="430" y="498" font-family="monospace" font-size="9" fill="#cbd5e1">Complies with ARINC Specification 659, RTCA DO-254 DAL A, and Boeing D6-55000.</text>
</svg>